<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryAssist AI Tester</title>
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-light.min.css">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>QueryAssist <span>AI</span></h1>
            <p>Test all API Endpoints</p>
        </header>

        <main>
            <div class="control-group">
                <label for="apiSelect">Select API Endpoint:</label>
                <select id="apiSelect">
                    <optgroup label="Semantic Explanation">
                        <option value="explain-sp">POST /dontuse</option>
                        <option value="explain-table">POST /testing-table</option>
                    </optgroup>
                    <optgroup label="General AI Querying">
                        <option value="analyze-sp">POST /analyze-sp</option>
                    </optgroup>
                    <optgroup label="Queue Embeddings (Background)">
                    </optgroup>
                </select>
            </div>

            <!-- Single text input for questions / requirements -->
            <div id="textInputContainer" class="input-container">
                <label for="questionInput" id="textInputLabel">Question / Requirement:</label>
                <input type="text" id="questionInput" placeholder="Enter your question here..." />
            </div>

            <!-- Text area for JSON payloads (queueing) -->
            <div id="jsonInputContainer" class="input-container hidden">
                <label for="jsonInput">JSON Payload:</label>
                <textarea id="jsonInput" rows="10" placeholder='{"tables": [...]}'></textarea>
            </div>

            <!-- Inputs for Analyze SP -->
            <div id="analyzeSpContainer" class="input-container hidden">
                <label for="spTextInput">Stored Procedure Text:</label>
                <textarea id="spTextInput" rows="8" placeholder="CREATE PROCEDURE..."></textarea>
                
                <label for="usageLevelInput" style="margin-top: 10px; display: block;">Usage Level (1-100/min):</label>
                <input type="number" id="usageLevelInput" min="1" max="100" value="50" />
            </div>

            <button id="submitBtn">Send Request</button>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Processing request...</p>
            </div>

            <div id="results" class="hidden">
                <h2>Response:</h2>
                <div id="responseContent" class="response-box"></div>
            </div>

            <div id="error" class="hidden error-box"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/sql.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
